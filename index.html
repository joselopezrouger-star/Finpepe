<!-- El color real sale de --bg (tokens.css) y lo pone el script de abajo según el tema. -->
<meta name="theme-color" id="meta-theme-color" content="">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FinPep">

<script>
  // Aplica el tema guardado antes de pintar la página, para evitar el
  // parpadeo de pasar de un tema a otro un instante después de cargar.
  // Por defecto arranca en oscuro (tokens.css); "light" lo pisa.
  try {
    if (localStorage.getItem('finpepe:theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) { /* sin storage: queda en oscuro */ }
  // Barra de estado / del navegador del mismo color que el fondo. Los
  // estilos de arriba ya cargaron (un script espera a las hojas previas).
  document.getElementById('meta-theme-color').content =
    getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
</script>
</head>
